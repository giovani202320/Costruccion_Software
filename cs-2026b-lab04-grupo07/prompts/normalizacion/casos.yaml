- description: "N6 - Borde (producto fuera de catálogo): zapatillas nike"
  vars:
    id: "N6"
    texto: "zapatillas nike talla 42 originales"
    esperado_catalogo: "desconocido"
  metadata:
    tipo: "borde"
    esperado: "JSON válido con producto_catalogo='desconocido'; nunca inventar una categoría ni forzar un producto alimenticio."
  assert:
    - type: javascript
      metric: B4_desconocido_sin_inventar
      value: |
        try {
          return JSON.parse(output).producto_catalogo === 'desconocido';
        } catch (e) {
          return false;
        }


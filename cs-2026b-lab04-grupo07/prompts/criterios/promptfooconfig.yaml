description: "Evaluación automatizada de criterios de aceptación Gherkin (Tarea A - San Camilo en Línea)"

prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3

providers:
  - id: file://../proveedor_grabado.py
    label: asistente-grabado
    config:
      tarea: criterios

defaultTest:
  assert:
    - type: is-json
      value: file://esquema.json
      metric: A1_contrato_json
    - type: javascript
      metric: A2_exito_y_error
      value: |
        try {
          const d = JSON.parse(output);
          if (context.vars.id === 'H7' && d.invest_ok === false) {
            return true;
          }
          const tipos = (d.escenarios || []).map(e => e.tipo);
          return d.invest_ok === true &&
            tipos.includes('exito') &&
            (tipos.includes('error') || tipos.includes('borde'));
        } catch (e) {
          return false;
        }
    - type: javascript
      metric: A3_sin_implementacion
      value: |
        let texto = output;
        try {
          const parsed = JSON.parse(output);
          texto = JSON.stringify(parsed.escenarios || []);
        } catch (e) {}
        const patron = /\b(postgresql|redis|fastapi|django|react|webhooks?|endpoints?|tablas?|api\s+de|base\s+de\s+datos)\b|claves?\s+for[áa]neas?|[íi]ndices?\s+compuestos?/i;
        return !patron.test(texto);

tests: file://casos.yaml

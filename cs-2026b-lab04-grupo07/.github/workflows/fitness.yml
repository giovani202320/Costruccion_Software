name: fitness-functions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  arquitectura:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de fitness functions
        run: |
          python -m pip install --upgrade pip
          pip install import-linter pytest matplotlib

      - name: Ejecutar fitness functions estructurales (FF-01 y FF-02)
        run: |
          export PYTHONPATH="src:$PYTHONPATH"
          lint-imports

      - name: Ejecutar fitness functions de calidad (FF-03 a FF-07)
        run: |
          export PYTHONPATH="src:.:$PYTHONPATH"
          pytest -v tests/test_fitness.py
